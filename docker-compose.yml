version: '3.9'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: ims-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ims_chile
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ims-network

  # Backend API
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: ims-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/ims_chile?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRE: 7d
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your-password}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-your-token}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-your-phone-id}
    depends_on:
      - mongodb
    networks:
      - ims-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend App
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: ims-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_ENV: ${NODE_ENV:-development}
    depends_on:
      - backend
    networks:
      - ims-network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: ims-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ims-network

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:

networks:
  ims-network:
    driver: bridge
